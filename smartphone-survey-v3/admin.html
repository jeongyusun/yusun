</main><script>
const S=[{"id":"screen","title":"조사 참여 동의 및 대상 확인","questions":[{"id":"SQ0","title":"위 안내 사항을 확인하였으며, 본 설문조사에 자발적으로 참여하는 것에 동의하십니까?","type":"one","options":["동의합니다.","동의하지 않습니다."]},{"id":"SQ1","title":"귀하의 만 나이는 어떻게 되십니까?","type":"one","options":["만 19세 이하","만 20~24세","만 25~29세","만 30~34세","만 35~39세","만 40세 이상"]},{"id":"SQ2","title":"현재 주로 사용하고 있는 스마트폰 브랜드는 무엇입니까? (두 대 이상 사용한다면 가장 주로 사용하는 스마트폰을 기준으로 응답해 주세요.)","type":"one","options":["애플(아이폰)","삼성(갤럭시)","기타 브랜드"]}]},{"id":"history","title":"스마트폰 이용 이력 및 향후 구매 의향","questions":[{"id":"Q1","title":"생애 처음 사용했던 스마트폰 브랜드는 무엇입니까?","type":"one","options":["애플(아이폰)","삼성(갤럭시)","LG","기타 브랜드","기억나지 않음"]},{"id":"Q2","title":"현재 스마트폰으로 교체하기 직전에 사용했던 스마트폰 브랜드는 무엇입니까?","type":"one","options":["애플(아이폰)","삼성(갤럭시)","LG","기타 브랜드","현재 스마트폰이 첫 스마트폰임","기억나지 않음"]},{"id":"Q3","title":"지금까지 본인의 주 사용 스마트폰으로 사용해 본 브랜드를 모두 선택해 주세요.","type":"multi","options":["애플(아이폰)","삼성(갤럭시)","LG","기타 브랜드"],"max":4},{"id":"Q4","title":"현재 사용 중인 스마트폰을 구매한 지 얼마나 되었습니까?","type":"one","options":["6개월 미만","6개월 이상~1년 미만","1년 이상~2년 미만","2년 이상~3년 미만","3년 이상"]},{"id":"Q5","title":"다음 스마트폰은 언제쯤 교체할 계획이십니까?","type":"one","options":["6개월 이내","6개월 이후~1년 이내","1년 이후~2년 이내","2년 이후","구체적인 교체 계획 없음"]},{"id":"Q6","title":"다음에 스마트폰을 구매한다면 어느 브랜드를 구매하시겠습니까?","type":"one","options":["애플(아이폰)","삼성(갤럭시)","기타 브랜드","아직 결정하지 못함"]}]},{"id":"environment","title":"스마트폰 이용 환경","questions":[{"id":"Q7","title":"평소 스마트폰을 주로 어떤 용도로 사용하십니까?","type":"multi","options":["전화 및 메시지 등 커뮤니케이션","SNS 이용 및 콘텐츠 공유","사진 및 동영상 촬영","영상·음악·웹툰 등 콘텐츠 감상","업무 및 학업","모바일 결제 및 금융 서비스","게임","정보 검색 및 AI 활용","기타(직접 입력)"],"max":3},{"id":"Q8","title":"현재 스마트폰 외에 정기적으로 사용하는 디지털 기기를 모두 선택해 주세요.","type":"multi","options":["애플워치","에어팟 또는 애플 계열 무선이어폰·헤드폰","아이패드","맥북 또는 아이맥","갤럭시 워치","갤럭시 버즈","갤럭시 탭","갤럭시 북","기타 브랜드 스마트워치","기타 브랜드 무선이어폰·헤드폰","기타 브랜드 태블릿 또는 PC","기타 디지털 기기","해당 없음"],"max":13},{"id":"Q9","title":"현재 스마트폰과 다른 디지털 기기의 연동 및 호환성이 다음 스마트폰 선택에 얼마나 중요합니까?","type":"grid","rows":["연동 및 호환성"],"scale":"importance","extra" const $=id=>document.getElementById(id);

const percent=(x,n)=>n?(x/n*100).toFixed(1)+"%":"—";
const num=x=>Number.isInteger(x)&&x>=1&&x<=7;
const ans=(r,k)=>r.answers?.[k];
const values=(r,k,n)=>Array.from({length:n},(_,i)=>ans(r,k+"-"+(i+1))).filter(num);
const score=(r,k,n,min=n)=>{let v=values(r,k,n);return v.length>=min?avg(v):null};
const intent=r=>score(r,"A1",3),retention=r=>score(r,"B9",3);
const age=r=>/^만 2/.test(ans(r,"SQ1")||"")?"20대":/^만 3/.test(ans(r,"SQ1")||"")?"30대":"기타";

const switcher=r=>ans(r,"SQ2")===G&&ans(r,"B1")==="있다.";

function raw(rs){return panel("개별 응답",'<p class="muted">선택한 필터의 '+rs.length+'건입니다. 접수번호를 열어 모든 기록을 확인할 수 있습니다.</p>'+rs.map(r=>'<details><summary>'+esc(r.id.slice(0,8))+' · '+esc(ans(r,"SQ2"))+' · '+esc(r.team)+' · '+esc(r.durationSeconds)+'초</summary>'+tabular(["문항 코드","응답"],Object.entries(r.answers||{}).map(([k,v])=>[k,Array.isArray(v)?v.join(" / "):v]))+'<p class="tiny muted">'+esc(r.submittedAt)+' · '+(r.test?"검토용":"본조사")+'</p></details>').join(""))}
function textView(rs){return Q.filter(q=>q.type==="text"||q.options?.includes("기타(직접 입력)")).map(q=>{let k=q.type==="text"?q.id:q.id+"_other",v=rs.filter(r=>eligible(r,q)&&String(ans(r,k)||"").trim());return panel(q.id+" · "+q.title,'<p class="muted">'+v.length+'건</p>'+v.map(r=>'<div class="quote">'+esc(ans(r,k))+'</div>').join(""))}).join("")}
function render(){if(!loaded)return;let live=data.filter(r=>!r.test),i=live.filter(r=>ans(r,"SQ2")===I).length,g=live.filter(r=>ans(r,"SQ2")===G).length; $("metrics").innerHTML=[["본조사",live.length+"/40"],["아이폰",i+"/24"],["갤럭시",g+"/16"],["실제 전환자",live.filter(switcher).length],["검토용",data.length-live.length]].map(([l,v])=>'<div class="metric"><small>'+l+'</small><strong>'+v+'</strong></div>').join("");let rs=filtered();$("scope").textContent="현재 필터 적용 응답 "+rs.length+"명 · 전체 실제 응답 "+live.length+"명";$("tabs").innerHTML=tabs.map(([id,l])=>'<button data-tab="'+id+'" class="'+(id===active?"active":"")+'">'+l+'</button>').join("");let html="";if(active==="overview")html=overview(rs);if(active==="questions")html=panel("문항 선택",'<select id="question" style="max-width:100%;width:100%"><option value="all">전체 문항</option>'+Q.map(q=>'<option value="'+q.id+'" '+(question===q.id?"selected":"")+'>'+esc(q.id+" · "+q.title)+'</option>').join("")+'</select>')+Q.filter(q=>question==="all"||q.id===question).map(q=>qPanel(q,rs)).join("");if(active==="cross")html=cross(rs);if(active==="hyp")html=hyp(rs);if(active==="movement")html=movement(rs);if(active==="barrier")html=barrier(rs);if(active==="target")html=target(rs);if(active==="text")html=textView(rs);if(active==="raw")html=raw(rs);$("view").innerHTML=(rs.length?"":'<p class="sectionnote">현재 집계할 응답이 없습니다. 실제 응답이 제출되면 새로고침해 주세요.</p>')+html;document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()});if($("question"))$("question").onchange=e=>{question=e.target.value;render()};if($("cx"))$("cx").onchange=e=>{crossX=e.target.value;render()};if($("cy"))$("cy").onchange=e=>{crossY=e.target.value;render()}}
function csv(rows){let c=v=>{let s=Array.isArray(v)?v.join(" | "):String(v??"");if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};return "\ufeff"+rows.map(r=>r.map(c).join(",")).join("\r\n")}
function dl(name,content,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const csvdl=(name,rows)=>dl(name,csv(rows),"text/csv;charset=utf-8");
$("rawcsv").onclick=()=>{let keys=["id","version","team","test","startedAt","submittedAt","durationSeconds",...Q.flatMap(q=>q.type==="grid"?q.rows.map((r,i)=>q.id+"-"+(i+1)):q.options?.includes("기타(직접 입력)")?[q.id,q.id+"_other"]:[q.id])];csvdl("survey-v3-raw.csv",[keys,...filtered().map(r=>keys.map(k=>r[k]??ans(r,k)))])};
$("rawjson").onclick=()=>dl("survey-v3-raw.json",JSON.stringify(filtered(),null,2),"application/json");
$("statcsv").onclick=()=>{let rs=filtered(),rows=[["문항","문구","항목","응답 대상 n","유효 n","선택 수","비율","평균","표준편차","1","2","3","4","5","6","7","비수치 응답","미응답"]];Q.forEach(q=>{let sub=rs.filter(r=>eligible(r,q));if(q.type==="grid")q.rows.forEach((l,i)=>{let a=rowStat(sub,q.id+"-"+(i+1));rows.push([q.id,q.title,l,sub.length,a.n,"","",fmt(a.mean),fmt(a.sd),...a.dist,a.special,a.missing])});else if(q.type==="text")rows.push([q.id,q.title,"작성 응답",sub.length,sub.filter(r=>String(ans(r,q.id)||"").trim()).length]);else{let a=distribution(q,sub);a.rows.forEach(([l,n])=>rows.push([q.id,q.title,l,sub.length,a.n,n,percent(n,a.n)]))}});csvdl("survey-v3-question-stats.csv",rows)};
$("reportcsv").onclick=()=>{let rs=filtered();let rows=[["가설별 평균 비교"],hypHead,...hypRows(rs),[],["전환 장벽"],barrierHead,...barrierRows(rs),[],["타깃 분석"],targetHead,...targetRows(rs)];for(let [x,y] of [["Q1","SQ2"],["Q2","SQ2"],["SQ2","Q6"],[crossX,crossY]]){let m=matrix(rs,x,y);rows.push([],["교차분석",x,y],m.head,...m.rows)}csvdl("survey-v3-analysis.csv",rows)};
async function load(){let key=$("key").value;if(!key){$("msg").textContent="관리자 키를 입력해 주세요.";return}$("load").disabled=true;$("refresh").disabled=true;$("msg").textContent="응답을 불러오는 중…";try{let r=await fetch("/api/responses",{headers:{Authorization:"Bearer "+key},cache:"no-store"});if(!r.ok)throw Error("관리자 키 또는 서버 상태를 확인해 주세요. (HTTP "+r.status+")");let d=await r.json();if(!Array.isArray(d))throw Error("응답 형식 오류");data=d;loaded=true;$("dashboard").hidden=false;$("msg").textContent="최종 갱신: "+new Date().toLocaleString("ko-KR")+" · "+data.length+"건";render()}catch(e){$("msg").textContent=e.message;if(!loaded)$("dashboard").hidden=true}finally{$("load").disabled=false;$("refresh").disabled=false}}
$("load").onclick=load;$("refresh").onclick=load;$("key").onkeydown=e=>{if(e.key==="Enter")load()};document.querySelectorAll("#filters select").forEach(el=>el.onchange=render);$("links").innerHTML=[1,2,3,4].map(n=>'<p>팀원 '+n+' : <a href="/?team='+n+'">'+location.origin+'/?team='+n+'</a></p>').join("")+'<p>검토용: <a href="/?test=1">'+location.origin+'/?test=1</a></p>';
</script></body></html>
