</style></head><body><main><header><small>서강대학교 경영전문대학원 · 마케팅조사</small><h1>2030 스마트폰 이용 경험 및 브랜드 선택에 관한 조사</h1><p>만 20~39세 · 약 10분 · 익명 학술 조사</p></header><div id="app"></div><footer>마케팅조사 기말 팀 프로젝트 · 설문 v3</footer></main><script>
const S=[{"id":"screen","title":"조사 참여 동의 및 대상 확인","questions":[{"id":"SQ0","title":"위 안내 사항을 확인하였으며, 본 설문조사에 자발적으로 참여하는 것에 동의하십니까?","type":"one","options":["동의합니다.","동의하지 않습니다."]},{"id":"SQ1","title":"귀하의 만 나이는 어떻게 되십니까?","type":"one","options":["만 19세 이하","만 20~24세","만 25~29세","만 30~34세","만 35~39세","만 40세 이상"]},{"id":"SQ2","title":"현재 주로 사용하고 있는 스마트폰 브랜드는 무엇입니까? (두 대 이상 사용한다면 가장 주로 사용하는 스마트폰을 기준으로 응답해 주세요.)","type":"one","options":["애플(아이폰)","삼성(갤럭시)","기타 브랜드"]}]},{"id":"history","title":"스마트폰 이용 이력 및 향후 구매 의향","questions":[{"id":"Q1","title":"생애 처음 사용했던 스마트폰 브랜드는 무엇입니까?","type":"one","options":["애플(아이폰)","삼성(갤럭시)","LG","기타 브랜드","기억나지 않음"]},{"id":"Q2","title":"현재 스마트폰으로 교체하기 직전에 사용했던 스마트폰 브랜드는 무엇입니까?","type":"one","options":["애플(아이폰)","삼성(갤럭시)","LG","기타 브랜드","현재 스마트폰이 첫 스마트폰임","기억나지 않음"]},{"id":"Q3","title":"지금까지 본인의 주 사용 스마트폰으로 사용해 본 브랜드를 모두 선택해 주세요.","type":"multi","options":["애플(아이폰)","삼성(갤럭시)","LG","기타 브랜드"],"max":4},{"id":"Q4","title":"현재 사용 중인 스마트폰을 구매한 지 얼마나 되었습니까?","type":"one","options":["6개월 미만","6개월 이상~1년 미만","1년 이상~2년 미만","2년 이상~3년 미만","3년 이상"]},{"id":"Q5","title":"다음 스마트폰은 언제쯤 교체할 계획이십니까?","type":"one","options":["6개월 이내","6개월 이후~1년 이내","1년 이후~2년 이내","2년 이후","구체적인 교체 계획 없음"]},{"id":"Q6","title":"다음에 스마트폰을 구매한다면 어느 브랜드를 구매하시겠습니까?","type":"one","options":["애플(아이폰)","삼성(갤럭시)","기타 브랜드","아직 결정하지 못함"]}]},{"id":"environment","title":"스마트폰 이용 환경","questions":[{"id":"Q7","title":"평소 스마트폰을 주로 어떤 용도로 사용하십니까?","type":"multi","options":["전화 및 메시지 등 커뮤니케이션","SNS 이용 및 콘텐츠 공유","사진 및 동영상 촬영","영상·음악·웹툰 등 콘텐츠 감상","업무 및 학업","모바일 결제 및 금융 서비스","게임","정보 검색 및 AI 활용","기타(직접 입력)"],"max":3},{"id":"Q8","title":"현재 스마트폰 외에 정기적으로 사용하는 디지털 기기를 모두 선택해 주세요.","type":"multi","options":["애플워치","에어팟 또는 애플 계열 무선이어폰·헤드폰","아이패드","맥북 또는 아이맥","갤럭시 워치","갤럭시 버즈","갤럭시 탭","갤럭시 북","기타 브랜드 스마트워치","기타 브랜드 무선이어폰·헤드폰","기타 브랜드 태블릿 또는 PC","기타 디지털 기기","해당 없음"],"max":13},{"id":"Q9","title":"현재 스마트폰과 다른 디지털 기기의 연동 및 호환성이 다음 스마트폰 선택에 얼마나 중요합니까?","type":"grid","rows":["연동 및 호환성"],"scale":"importance","extra" function render(){const sec=S.find(z=>z.id===page);let total=answers.SQ2==="삼성(갤럭시)"?8:6;let step=trail.length+1;app.innerHTML=(test?'<p class="test">팀원 검토 모드 · 테스트 응답은 본조사와 분리 저장됩니다.</p>':'')+'<div class="hint">진행 단계 '+step+' / '+total+'</div><div class="progress"><div style="width:'+Math.min(100,step/total*100)+'%"></div></div><h2>'+esc(sec.title)+'</h2>'+(page==="screen"?'<article>안녕하세요. 본 설문은 서강대학교 경영전문대학원 마케팅조사 수업의 일환으로 20~30대의 스마트폰 이용 경험과 브랜드 선택 요인을 파악하기 위해 진행합니다. 응답 내용은 학술적 목적으로만 활용되며 이름이나 연락처 등 개인을 식별할 수 있는 정보는 수집하지 않습니다. 정해진 답은 없으므로 실제 경험을 바탕으로 응답해 주세요. 자유 응답에 개인식별정보를 적지 말아 주세요.</article>':'')+(page==="switch"?'<p class="hint">가장 최근에 아이폰에서 갤럭시로 바꿨던 경험을 기준으로 응답합니다.</p>':'')+'<form id="form">'+sec.questions.map(q=>{let h='<article><fieldset><legend>'+q.id+'. '+esc(q.title)+'</legend>';if(q.type==="text")h+='<div class="hint">선택 응답</div><textarea name="'+q.id+'" maxlength="2000">'+esc(answers[q.id])+'</textarea>';else if(q.type==="grid"){const sc=scales[q.scale];h+='<p class="hint">1점: '+sc[0]+' / 4점: '+sc[3]+' / 7점: '+sc[6]+'</p>';h+=q.rows.map((r,i)=>{let n=q.id+"-"+(i+1);return '<div class="sub"><p>'+esc(r)+'</p><div class="scale">'+sc.map((label,j)=>'<label title="'+esc(label||String(j+1))+'"><input type="radio" name="'+n+'" value="'+(j+1)+'" '+(answers[n]==j+1?'checked':'')+' aria-label="'+esc(label||String(j+1))+'"><span>'+(j+1)+'</span></label>').join("")+'</div><div class="ends"><span>'+esc(sc[0])+'</span><span>'+esc(sc[6])+'</span></div>'+[...q.extra,...(q.rowExtra?.[i+1]||[])].map(v=>option(n,v,v,"radio",answers[n]===v)).join("")+'</div>'}).join("");}else{if(q.type==="multi")h+='<p class="hint">'+(q.max<q.options.length?'최대 '+q.max+'개 선택':'복수 선택 가능')+'</p>';h+=q.options.map(v=>option(q.id,v,v,q.type==="multi"?"checkbox":"radio",q.type==="multi"?(answers[q.id]||[]).includes(v):answers[q.id]===v)).join("");if(q.options.includes("기타(직접 입력)"))h+='<input type="text" name="'+q.id+'_other" placeholder="기타 선택 시 내용을 입력해 주세요" maxlength="500" value="'+esc(answers[q.id+"_other"])+'">';}return h+'</fieldset></article>'}).join("")+'<p id="err" class="error" role="alert"></p><div class="nav">'+(trail.length?'<button type="button" class="secondary" id="back">이전</button>':'<span></span>')+'<button type="submit" id="next">'+(page==="demo"?"제출하기":"다음")+'</button></div></form>';const f=document.getElementById("form");f.addEventListener("change",e=>{let el=e.target;if(el.type==="checkbox"){const q=sec.questions.find(z=>z.id===el.name);if(!q)return;const all=[...f.querySelectorAll('input[name="'+q.id+'"]:checked')];if(el.checked&&["해당 없음","특별히 만족하는 부분 없음"].includes(el.value))all.filter(v=>v!==el).forEach(v=>v.checked=false);else if(el.checked)all.filter(v=>["해당 없음","특별히 만족하는 부분 없음"].includes(v.value)).forEach(v=>v.checked=false);if(f.querySelectorAll('input[name="'+q.id+'"]:checked').length>q.max){el.checked=false;document.getElementById("err").textContent="최대 "+q.max+"개까지 선택할 수 있습니다."}else document.getElementById("err").textContent="";}if(page==="screen"&&el.name==="SQ0"&&el.value==="동의하지 않습니다.")end();if(page==="screen"&&el.name==="SQ1"&&["만 19세 이하","만 40세 이상"].includes(el.value))end();if(page==="screen"&&el.name==="SQ2"&&el.value==="기타 브랜드")end();});document.getElementById("back")?.addEventListener("click",()=>{save(false);page=trail.pop();render();scrollTo(0,0)});f.onsubmit=async e=>{e.preventDefault();if(!save(true))return;if(page==="screen"&&(answers.SQ0!=="동의합니다."||["만 19세 이하","만 40세 이상"].includes(answers.SQ1)||answers.SQ2==="기타 브랜드"))return end();if(page==="demo"){const btn=document.getElementById("next");btn.disabled=true;btn.textContent="저장 중…";try{let payload={id:rid,version:"v3-web",test,team,startedAt:new Date(started).toISOString(),durationSeconds:Math.round((Date.now()-started)/1000),answers};let r=await fetch("/api/responses",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!r.ok)throw Error("저장되지 않았습니다. 다시 제출해 주세요.");let data=await r.json();if(!data.ok)throw Error("저장 확인 실패");app.innerHTML='<article><h2>응답이 제출되었습니다.</h2><p>소중한 의견을 보내주셔서 감사합니다.</p><p class="hint">접수번호 '+esc(rid.slice(0,8))+'</p></article>';scrollTo(0,0)}catch(e){document.getElementById("err").textContent=e.message;btn.disabled=false;btn.textContent="제출하기"}return;}let next={screen:"history",history:"environment",environment:"image",image:answers.SQ2==="애플(아이폰)"?"iphone":"galaxy",iphone:"demo",galaxy:answers.B1==="있다."?"switch":"noswitch",switch:"galaxycommon",noswitch:"galaxycommon",galaxycommon:"demo"}[page];trail.push(page);page=next;render();scrollTo(0,0)}}
function save(validate){const f=document.getElementById("form"),fd=new FormData(f),sec=S.find(z=>z.id===page);let bad=[];for(const q of sec.questions){if(q.type==="grid"){q.rows.forEach((_,i)=>{let n=q.id+"-"+(i+1),v=fd.get(n);if(v===null)bad.push(q.id+"-"+(i+1));else answers[n]=/^\d$/.test(v)?Number(v):v})}else{let v=q.type==="multi"?fd.getAll(q.id):fd.get(q.id);if(q.type!=="text"&&(!v||v.length===0))bad.push(q.id);answers[q.id]=v;if(q.options?.includes("기타(직접 입력)")){let o=fd.get(q.id+"_other")?.trim()||"";answers[q.id+"_other"]=o;if((Array.isArray(v)?v.includes("기타(직접 입력)"):v==="기타(직접 입력)")&&!o)bad.push(q.id+" 기타")}}}if(validate&&bad.length){document.getElementById("err").textContent="응답을 확인해 주세요: "+bad.join(", ");return false}return true}
function end(){app.innerHTML='<article><h2>설문이 종료되었습니다.</h2><p>관심을 가져주셔서 감사합니다. 해당 응답은 저장하지 않습니다.</p><button onclick="location.reload()">처음으로</button></article>'}render();
</script></body></html>
